# SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0
#
# The dependency-license allowlist, and the only copy of it.
# cargo-deny reads this file for the Rust tree and
# scripts/check-dart-licenses.py reads the same [licenses] table for the Dart
# tree, so the two ecosystems cannot drift onto different policies.
# Every allowed license below is permissive and imposes no source-disclosure
# or copyleft obligation on slim-m, which is not open source and could not
# satisfy one; anything else
# fails the gate and wants a human decision, one named package at a time.
# Why each exception is here, and why advisories and bans are not configured,
# is in docs/ci.md.

[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# A license only the Dart half uses is not an unused Rust allowance.
unused-allowed-license = "allow"

# slim-m's own crate is not open source, so it is named here rather than
# allowed outright: the allowlist above stays a statement about third-party
# dependencies only.
[[licenses.exceptions]]
name = "slimm-server"
allow = ["LicenseRef-PolyForm-Noncommercial-1.0.0"]

# MPL-2.0 is per-file copyleft and reaches neither client; see docs/ci.md.
[[licenses.exceptions]]
name = "dbus"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "nm"
allow = ["MPL-2.0"]

# The Dart pub package behind app_links_linux's GTK binding (invite deep
# links). Same posture as dbus/nm above: per-file copyleft we depend on and
# do not modify, so it reaches the built client no differently than they do.
[[licenses.exceptions]]
name = "gtk"
allow = ["MPL-2.0"]

# Checked on a schedule by advisory-watchdog.yml, never on a pull request.
# docs/ci.md's licenses section explains the split: a CVE published upstream
# would otherwise turn every unrelated pull request red through no fault of
# its own, so this "wants a different trigger" - that trigger exists now, and
# reports by opening an issue rather than by reddening anybody's branch.
# An entry in `ignore` is a deliberate, dated decision about one advisory,
# never a way to quiet the check.
[advisories]
ignore = []

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
