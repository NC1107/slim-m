# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/NC1107/slim-m"

# Shared dependency versions live here so every crate stays in lockstep.
[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
envy = "0.4"
uuid = { version = "1", features = ["v7"] }
jiff = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
anyhow = "1"

[profile.release]
# Small, fast self-host binary: the brief treats binary size as a budget.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
