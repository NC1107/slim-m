# SPDX-License-Identifier: AGPL-3.0-only
#
# Analysis scope. Everything excluded here is either vendored from an upstream
# release or produced by a code generator, so a finding in it is not something
# anyone here can act on: the fix is to change the generator or the pinned
# version, never the file.
#
# This started with 2912 issues in one vendored minified worker. That file is
# fetched rather than committed now, so what is left here is generated Dart and
# the sqlx cache: a finding in either means changing the generator, never the
# file.

sonar.projectKey=NC1107_slim-m
sonar.organization=nc1107

# Drift's web worker and the SQLite WASM binary, downloaded verbatim from the
# releases matching our pinned drift and sqlite3 versions. See
# client/packages/app/web/README.md for provenance and the rule that bumping
# either means re-downloading in the same change.
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated_plugin_registrant.*,\
  .sqlx/**

# Generated code should not count toward duplication either, since a generator
# repeating itself is not a maintenance signal.
sonar.cpd.exclusions=\
  **/*.g.dart
