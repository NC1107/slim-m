# Redocly lint config for the slim-m wire schema.
# The recommended ruleset's structural checks are kept; two opinionated rules
# are relaxed for a minimal internal wire API:
# - security-defined: auth is a WebSocket connect-time ticket, not per-operation
#   HTTP security schemes, so requiring security on every REST operation is noise
#   in Phase 0. Revisit when the authenticated surface is specified in Phase 1.
# - operation-4xx-response: liveness and version endpoints do not need a 4xx.
rules:
  security-defined: off
  operation-4xx-response: off
