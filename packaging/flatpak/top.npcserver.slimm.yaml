# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json
# SPDX-License-Identifier: Apache-2.0
#
# Flatpak manifest for the slim-m desktop client. This repackages the same
# Flutter Linux bundle the rpm (packaging/rpm/slim-m-client.spec) repackages,
# rather than running `flutter build linux` inside the sandbox: the build
# sandbox has no network by default, and `dart pub get` needs one. `release.yml`
# builds the bundle first and this manifest's `dir` source points straight at
# its output, so nothing here duplicates that build.
#
# The app id, desktop file and icons are the same ones the rpm installs
# (top.npcserver.slimm everywhere), on purpose: two different ids for one app
# would split its icon cache entry, its notification grouping and its
# eventual Secret Service keyring namespace for no reason.
#
# Verification status (packaging/flatpak/README.md has the full account):
# built successfully with `org.flatpak.Builder` against a real
# `flutter build linux --release` output on 2026-08-05, producing an
# installable bundle. The app has not been launched from that bundle, so the
# runtime permissions below are reasoned from source and from a working
# Element (Electron+WebRTC) manifest, not confirmed on a running instance.
# Updated 2026-08-11 for the close-to-tray window shell (PR #533): the bundle
# now hard-links against libayatana-appindicator3, absent from the runtime, so
# a libayatana-appindicator module builds it. See the README's own account of
# what this pass could and could not verify locally.
#
# Updated 2026-08-28: media_kit_video's own Linux plugin links libmpv and
# libepoxy directly (confirmed with readelf on the built .so - real NEEDED
# entries, not a dlopen), and Flutter dlopens every registered plugin at
# process startup, so a runtime missing either library fails to launch at
# all, not merely fails to play video. `org.freedesktop.Platform//25.08`
# already carries libepoxy and the ffmpeg libraries mpv links against
# (confirmed by inspecting the runtime, not assumed), so nothing here
# vendors ffmpeg. It does not carry libmpv, so the `libass` and
# `libplacebo`/`mpv` modules below build it. mpv (0.37+) links libplacebo
# unconditionally, even for its plain GL output and not only its optional
# vo_gpu_next, so building a current mpv means building libplacebo too; the
# alternative of pinning mpv below 0.37 would dodge that module but ship a
# video-playback dependency more than two years stale, a worse trade for a
# shipping blocker than one extra build module. Built and installed for
# real, and confirmed to get past the exact reported failure - see the
# README's own account of what this pass could and could not verify.

app-id: top.npcserver.slimm
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: slim-m
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Voice and screen-share audio; GStreamer's pulsesink/pulsesrc reach it too.
  - --socket=pulseaudio
  - --device=dri
  # Raw /dev/video* for the webcam: flutter_webrtc's V4L2 capturer, not a portal (same as Element's manifest).
  - --device=all
  - --share=network
  # flutter_secure_storage's Linux plugin is libsecret, talking to the Secret Service D-Bus name directly.
  - --talk-name=org.freedesktop.secrets
  # Belt-and-suspenders PipeWire socket access alongside the ScreenCast portal (again matches Element).
  - --filesystem=xdg-run/pipewire-0
  # tray_manager registers a StatusNotifierItem; this is the watcher every desktop implements (Vesktop's grant).
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  # tray_manager links libayatana-appindicator3 directly (not dlopen'd), and
  # the runtime carries none of this stack. flathub/shared-modules' own
  # module, vendored rather than a git submodule since this repo has no other.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  # media_kit_video links libmpv directly; libass is libmpv's own subtitle dep.
  # No buildsystem key: autotools by default, whose own libdir default is a
  # plain '<prefix>/lib' with no lib64/multiarch detection, unlike cmake and
  # meson below. Confirmed against real CI logs, not assumed: this and
  # libdbusmenu (also autotools) both install to /app/lib/pkgconfig with no
  # libdir override. See packaging/flatpak/README.md's fifth defect.
  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
  # mpv links libplacebo unconditionally since 0.37; built GL-only (Vulkan
  # disabled) since media_kit_video only ever drives mpv's plain GL output.
  - name: libplacebo
    buildsystem: meson
    build-options:
      libdir: lib
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Dgl-proc-addr=enabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Ddemos=false
      - -Dtests=false
      - -Dbench=false
      - -Dfuzz=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
  # libmpv only, no CLI player; audio/video backends stay 'auto' to pick up
  # whatever the runtime/SDK already carry (GL, VAAPI, PulseAudio, ALSA).
  - name: mpv
    buildsystem: meson
    build-options:
      libdir: lib
    config-opts:
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dgl=enabled
      - -Dplain-gl=enabled
      - -Dvulkan=disabled
      - -Dcplugins=disabled
      - -Djavascript=disabled
      - -Dlua=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Dvapoursynth=disabled
      - -Duchardet=disabled
      - -Drubberband=disabled
      - -Dzimg=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
  - name: slim-m-client
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -d /app/slim-m/lib /app/slim-m/data /app/bin
      - install -m0755 bundle/slimm_app /app/slim-m/slimm_app
      - cp -a bundle/lib/. /app/slim-m/lib/
      - cp -a bundle/data/. /app/slim-m/data/
      - for so in /app/slim-m/lib/*.so; do patchelf-bin/bin/patchelf --set-rpath '$ORIGIN' "$so"; done
      - chmod 0755 /app/slim-m/lib/*.so
      - ln -s ../slim-m/slimm_app /app/bin/slim-m
      - install -Dm644 top.npcserver.slimm.desktop /app/share/applications/top.npcserver.slimm.desktop
      - install -Dm644 top.npcserver.slimm-16.png /app/share/icons/hicolor/16x16/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-22.png /app/share/icons/hicolor/22x22/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-24.png /app/share/icons/hicolor/24x24/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-32.png /app/share/icons/hicolor/32x32/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-48.png /app/share/icons/hicolor/48x48/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-64.png /app/share/icons/hicolor/64x64/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-128.png /app/share/icons/hicolor/128x128/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-256.png /app/share/icons/hicolor/256x256/apps/top.npcserver.slimm.png
      - install -Dm644 top.npcserver.slimm-512.png /app/share/icons/hicolor/512x512/apps/top.npcserver.slimm.png
      # gdk-pixbuf sniffs an SVG by its first bytes; this drops the source's leading comment, which defeats that.
      - sed -n '/<svg/,$p' top.npcserver.slimm.svg > icon.svg
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/top.npcserver.slimm.svg
    sources:
      # The already-built Flutter bundle; see release.yml's linux-client job.
      - type: dir
        path: ../../client/packages/app/build/linux/x64/release/bundle
        dest: bundle
      # A prebuilt static patchelf, used only at build time: the SDK carries none (checked, not assumed).
      - type: archive
        url: https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz
        sha256: a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf
        dest: patchelf-bin
        only-arches:
          - x86_64
      - type: file
        path: ../rpm/top.npcserver.slimm.desktop
      - type: file
        path: ../linux/icons/top.npcserver.slimm-16.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-22.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-24.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-32.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-48.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-64.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-128.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-256.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm-512.png
      - type: file
        path: ../linux/icons/top.npcserver.slimm.svg
