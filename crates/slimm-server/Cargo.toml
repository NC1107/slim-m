# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "slimm-server"
version = "0.37.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "slim-m home server (Phase 0 foundation skeleton)"

[lib]
name = "slimm_server"
path = "src/lib.rs"

[[bin]]
name = "slimm-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
envy.workspace = true
uuid.workspace = true
jiff.workspace = true
sqlx.workspace = true
anyhow.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand_core.workspace = true
futures-util.workspace = true
crypto_box.workspace = true
reqwest.workspace = true
url.workspace = true
ed25519-dalek.workspace = true
# `util` for ServiceExt::oneshot, which asks the router what it serves
# (http/capability.rs); `limit` for the router's concurrency bound. Both named
# explicitly rather than relied on through feature unification: `timeout` is
# reachable today only because reqwest happens to enable it, which would break
# confusingly in an unrelated crate if reqwest ever went away.
tower = { version = "0.5", features = ["util", "limit"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# A real client for the fan-out test; the round-trip tests use tower above.
tokio-tungstenite = "0.24"
# Validates real responses against schema/openapi.yaml in tests/response_contract.rs.
# The `default-features = false` cut is deliberate; see docs/dependencies.md.
jsonschema = { version = "0.49", default-features = false }
# The maintained fork of the archived serde_yaml, only to turn the schema into
# a serde_json::Value the validator can compile.
serde_yaml_ng = "0.10"

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Componentization and clarity are enforced, not just encouraged.
all = { level = "warn", priority = -1 }
