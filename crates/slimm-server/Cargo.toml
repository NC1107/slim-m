# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "slimm-server"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "slim-m home server (Phase 0 foundation skeleton)"

[[bin]]
name = "slimm-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
envy.workspace = true
uuid.workspace = true
jiff.workspace = true
sqlx.workspace = true
anyhow.workspace = true

# serde_json is bench-only: the shipped binary never needs a JSON encoder of
# its own, and the size-optimized release profile should not pay for one.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Componentization and clarity are enforced, not just encouraged.
all = { level = "warn", priority = -1 }
