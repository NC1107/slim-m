# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "slimm-server"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "slim-m home server (Phase 0 foundation skeleton)"

[lib]
name = "slimm_server"
path = "src/lib.rs"

[[bin]]
name = "slimm-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
envy.workspace = true
uuid.workspace = true
jiff.workspace = true
sqlx.workspace = true
anyhow.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand_core.workspace = true
futures-util.workspace = true
crypto_box.workspace = true
reqwest.workspace = true
url.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# tower::ServiceExt::oneshot drives the HTTP round-trip tests in-process without
# binding a socket; tokio-tungstenite is a real WebSocket client for the
# two-client fan-out test.
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
# tests/response_contract.rs validates real responses against schema/openapi.yaml.
# An OpenAPI 3.1 schema object *is* a JSON Schema 2020-12 schema, so a general
# JSON Schema validator checks it directly rather than a hand-written copy of
# each shape drifting alongside the real one. `default-features = false` drops
# the file and http `$ref` resolvers (and the reqwest/aws-lc-rs they drag in):
# every `$ref` here is a local pointer into the one document.
jsonschema = { version = "0.49", default-features = false }
# The maintained fork of the archived serde_yaml, only to turn the schema into
# a serde_json::Value the validator can compile.
serde_yaml_ng = "0.10"

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Componentization and clarity are enforced, not just encouraged.
all = { level = "warn", priority = -1 }
