# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "slimm-server"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "slim-m home server (Phase 0 foundation skeleton)"

[lib]
name = "slimm_server"
path = "src/lib.rs"

[[bin]]
name = "slimm-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
envy.workspace = true
uuid.workspace = true
jiff.workspace = true
sqlx.workspace = true
anyhow.workspace = true
argon2.workspace = true
sha2.workspace = true
base64.workspace = true
rand_core.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# serde_json drives the benches directly; tower::ServiceExt::oneshot drives the
# auth HTTP round-trip test in-process without binding a socket.
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Componentization and clarity are enforced, not just encouraged.
all = { level = "warn", priority = -1 }
