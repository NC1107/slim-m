# SonarCloud automatic analysis reads this filename; sonar-project.properties is
# only consulted by CI-mode analysis. Both carry the same exclusions so neither
# mode lints a vendored bundle.
sonar.exclusions=client/packages/app/web/drift_worker.js,client/packages/app/web/sqlite3.wasm,**/*.g.dart,**/*.freezed.dart,**/generated_plugin_registrant.*,.sqlx/**
sonar.cpd.exclusions=**/*.g.dart,client/packages/app/web/drift_worker.js
