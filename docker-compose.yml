# SPDX-License-Identifier: AGPL-3.0-only
#
# Production self-host example for slim-m: a small friend-group deployment.
#
# Four services:
#   server     the slim-m home server (this repo's AGPL binary), embedded
#              SQLite on a named volume, reachable only through Caddy.
#   caddy      the only thing bound to 443. Terminates TLS automatically
#              (Let's Encrypt) for the API domain and LiveKit's signaling
#              domain.
#   livekit    voice and screen share. Its signaling channel is fronted by
#              Caddy like any other HTTPS traffic, but its TURN/TLS and UDP
#              media both need ports of their own - see the comments below
#              and in deploy/Caddyfile.
#   litestream continuously streams the SQLite file to S3-compatible
#              storage. Disabled by default (see deploy/.env.example);
#              enable it once you have a real bucket.
#
# Copy deploy/.env.example to `.env` next to this file and fill it in before
# running `docker compose up -d`. See deploy/README.md for the full
# walkthrough.

services:
  server:
    # Pin to a released server tag and bump it on every upgrade; the published
    # tags are at https://github.com/NC1107/slim-m/releases, and a rolling
    # `latest` is published alongside each one.
    #
    # SLIMM_VERSION in .env overrides this without editing the file. Do not
    # leave an old tag here: a stale server is one that predates every security
    # fix since, and this file used to ship pinned to the very first release.
    image: ghcr.io/nc1107/slim-m-server:${SLIMM_VERSION:-latest}
    restart: unless-stopped
    environment:
      SLIMM_LOG: ${SLIMM_LOG:-info}
    volumes:
      # SLIMM_DATABASE_PATH defaults to /data/slimm.db inside the image; the
      # whole /data directory is the volume so Litestream (below) can see the
      # database file and its WAL alongside it.
      - slimm_data:/data
    # The image already ships a HEALTHCHECK that runs the server's own
    # `--healthcheck` subcommand; no need to redeclare it here.
    expose:
      - "8080"

  caddy:
    # Pin to an exact release; check hub.docker.com/_/caddy/tags for newer patches.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "80:80"       # ACME HTTP-01 challenge and plain-HTTP redirect
      - "443:443"     # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      SLIMM_API_DOMAIN: ${SLIMM_API_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # ACME account + issued certificates, must persist
      - caddy_config:/config
    healthcheck:
      # Caddy's local admin API, enabled by default and bound to localhost
      # inside the container - a reachable 2019 means Caddy has loaded a config.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    # Pin to an exact release; check github.com/livekit/livekit/releases for newer patches.
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    # No bundled healthcheck: the image has no verified shell/HTTP client to
    # probe with, so this relies on `restart: unless-stopped` plus normal
    # log/monitoring rather than a Docker HEALTHCHECK.
    expose:
      - "7880" # WebSocket signaling, reverse-proxied by Caddy - not published to the host
    ports:
      - "7881:7881"       # TCP fallback for clients that cannot do UDP at all
      - "3478:3478/udp"   # STUN/TURN (UDP), the default LiveKit/TURN port
      - "${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-51000}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-51000}/udp"
      # TURN/TLS (TURNS) is deliberately NOT on 443 - Caddy already owns that
      # port for the API and LiveKit signaling domains, and TURN is not an
      # HTTP protocol Caddy can share it with. LiveKit's TURN/TLS listener
      # gets its own documented port instead (5349, the IANA default for
      # turns:). Uncomment the line below together with the matching `turn:`
      # block in LIVEKIT_CONFIG if you need it (see that block for the
      # trade-off this implies for very restrictive client networks).
      # - "5349:5349"
    environment:
      # LIVEKIT_CONFIG is LiveKit's own env binding for a full config.yaml
      # body - no separate config file needed for this example.
      #
      # The two key variables below deliberately have no ":-default" fallback,
      # unlike every other variable in this file. They authorize minting a room
      # token, so a placeholder default would be a publicly known credential on
      # a publicly reachable SFU, and anyone could forge a join token for any
      # room. The ":?" form makes compose refuse to start and name the missing
      # variable, which is the only safe way for this to fail. Generate a pair
      # with: docker run --rm livekit/livekit-server:v1.10.1 generate-keys
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_UDP_PORT_START:-50000}
          port_range_end: ${LIVEKIT_UDP_PORT_END:-51000}
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in .env, see deploy/README.md}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in .env to a random value of at least 32 characters}
        turn:
          enabled: true
          udp_port: 3478
          # TURN/TLS, off by default. Its listener needs its own certificate -
          # it cannot borrow Caddy's, since Caddy's ACME storage layout is not
          # a stable path to rely on. To turn it on: point a third DNS name at
          # this host (for example turn.${SLIMM_API_DOMAIN}), get a cert/key
          # for it by whatever means you like, mount them into this
          # container, and uncomment these four lines plus the matching
          # "5349:5349" port above.
          # domain: turn.example.com
          # tls_port: 5349
          # cert_file: /etc/livekit/turn.crt
          # key_file: /etc/livekit/turn.key
          #
          # Note: clients on networks so locked-down that only outbound 443
          # is allowed will not be able to use TURN/TLS to escape them, since
          # it is not on 443 here. Accepted trade-off for a friend-group
          # deployment; plain UDP TURN above covers ordinary home/NAT networks.

  litestream:
    # Pin to an exact release; check hub.docker.com/r/litestream/litestream/tags
    # for newer 0.3.x patches. Deliberately not on the 0.5.x line: 0.5
    # replaced the replica format (WAL segments -> LTX) and this example
    # targets the longer-documented, more stable 0.3 config/CLI surface.
    image: litestream/litestream:0.3.14
    # Disabled by default - this whole service only starts when the
    # "litestream" profile is enabled (see deploy/.env.example).
    profiles:
      - litestream
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - slimm_data:/data
    environment:
      # Litestream reads these two exact variable names natively.
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    # No config file: the S3-compatible endpoint and region are passed as
    # query parameters on the replica URL, which the 0.3.x CLI supports
    # directly (force-path-style is auto-enabled whenever `endpoint` is set).
    command: >
      replicate /data/slimm.db
      "s3://${LITESTREAM_S3_BUCKET}/${LITESTREAM_S3_PATH:-slimm}?endpoint=${LITESTREAM_S3_ENDPOINT}&region=${LITESTREAM_S3_REGION:-auto}"

volumes:
  slimm_data:   # the embedded SQLite database
  caddy_data:   # Caddy's ACME account and issued certificates
  caddy_config: # Caddy's runtime config cache
