# SPDX-License-Identifier: AGPL-3.0-only
#
# Production self-host example for slim-m: a small friend-group deployment.
#
# Four services:
#   server     the slim-m home server (this repo's AGPL binary), embedded
#              SQLite on a named volume, reachable only through Caddy.
#   caddy      the only thing bound to 443. Terminates TLS automatically
#              (Let's Encrypt) for the API domain and LiveKit's signaling
#              domain.
#   livekit    voice and screen share. Its signaling channel is fronted by
#              Caddy like any other HTTPS traffic, but its TURN/TLS and UDP
#              media both need ports of their own - see the comments below
#              and in deploy/Caddyfile.
#   litestream continuously streams the SQLite file to S3-compatible
#              storage. Disabled by default (see deploy/.env.example);
#              enable it once you have a real bucket.
#
# Copy deploy/.env.example to `.env` next to this file and fill it in before
# running `docker compose up -d`. See deploy/README.md for the full
# walkthrough.

services:
  server:
    # Set SLIMM_VERSION in .env to pin a release, and bump it on every upgrade:
    # a stale tag predates every security fix since. See deploy/README.md.
    image: ghcr.io/nc1107/slim-m-server:${SLIMM_VERSION:-latest}
    restart: unless-stopped
    environment:
      SLIMM_LOG: ${SLIMM_LOG:-info}
      # Empty means no CORS layer at all and every cross-origin browser request
      # refused. Only a web build on another origin needs it; deploy/README.md.
      SLIMM_CORS_ALLOWED_ORIGINS: ${SLIMM_CORS_ALLOWED_ORIGINS:-}
      # 1 because Caddy is the one proxy in front of this. Unset means the TCP
      # peer is trusted instead, which behind any proxy puts every
      # unauthenticated caller in one rate-limit bucket; deploy/README.md.
      SLIMM_TRUST_PROXY_HOPS: ${SLIMM_TRUST_PROXY_HOPS:-1}
      SLIMM_MAX_TOTAL_ATTACHMENT_BYTES: ${SLIMM_MAX_TOTAL_ATTACHMENT_BYTES:-}
      # Unset means no SFU and 501 for every voice request. The URL is the one
      # clients reach from outside, not the internal name; deploy/README.md.
      SLIMM_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env}
      SLIMM_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in .env, see deploy/README.md}
      SLIMM_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in .env to a random value of at least 32 characters}
    volumes:
      # The whole directory is the volume (SLIMM_DATABASE_PATH defaults to
      # /data/slimm.db) so Litestream can see the database file and its WAL.
      - slimm_data:/data
    # The image already ships a HEALTHCHECK that runs the server's own
    # `--healthcheck` subcommand; no need to redeclare it here.
    expose:
      - "8080"

  caddy:
    # Pin to an exact release; check hub.docker.com/_/caddy/tags for newer patches.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "80:80"       # ACME HTTP-01 challenge and plain-HTTP redirect
      - "443:443"     # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      SLIMM_API_DOMAIN: ${SLIMM_API_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # ACME account + issued certificates, must persist
      - caddy_config:/config
    healthcheck:
      # Caddy's local admin API, enabled by default and bound to localhost
      # inside the container - a reachable 2019 means Caddy has loaded a config.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    # Pin to an exact release; check github.com/livekit/livekit/releases for newer patches.
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    healthcheck:
      # Alpine's busybox wget against LiveKit's own unauthenticated "OK" liveness route; see deploy/README.md.
      test: ["CMD", "wget", "--quiet", "--spider", "-T", "3", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # LiveKit exits if its STUN hostname will not resolve, and systemd-resolved's
    # 127.0.0.53 stub does not exist in a container. See deploy/README.md.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    expose:
      - "7880" # WebSocket signaling, reverse-proxied by Caddy - not published to the host
    ports:
      # TCP fallback for clients that cannot do UDP at all. Configurable because
      # 7881 is popular and this may not be the only SFU on the host.
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}"
      # STUN/TURN (UDP), the default LiveKit/TURN port.
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"
      # TURN's relay ports, distinct from the media range below. Missing them is
      # worse than no TURN: relay candidates are advertised and all time out.
      - "${LIVEKIT_TURN_RELAY_PORT_START:-30000}-${LIVEKIT_TURN_RELAY_PORT_END:-30100}:${LIVEKIT_TURN_RELAY_PORT_START:-30000}-${LIVEKIT_TURN_RELAY_PORT_END:-30100}/udp"
      - "${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50100}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50100}/udp"
      # TURN/TLS gets 5349, never 443: Caddy owns 443 and TURN is not an HTTP
      # protocol it can share it with. To enable, see deploy/README.md.

      # - "5349:5349"
    environment:
      # LiveKit's own env binding for a full config.yaml body. The key and secret
      # take `:?` and never a default, on purpose; see deploy/README.md.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          port_range_start: ${LIVEKIT_UDP_PORT_START:-50000}
          port_range_end: ${LIVEKIT_UDP_PORT_END:-50100}
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in .env, see deploy/README.md}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in .env to a random value of at least 32 characters}
        turn:
          enabled: true
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
          # Narrowed from LiveKit's 30000-40000 default: nobody publishes ten
          # thousand ports, and unpublished relay ports connect nothing.
          relay_range_start: ${LIVEKIT_TURN_RELAY_PORT_START:-30000}
          relay_range_end: ${LIVEKIT_TURN_RELAY_PORT_END:-30100}
          # TURN/TLS is off: its listener needs a certificate of its own and
          # cannot borrow Caddy's. The four keys to add: deploy/README.md.

  litestream:
    # Held on 0.3.x deliberately: 0.5 replaced the replica format (WAL segments
    # became LTX), so moving is a migration. See deploy/README.md.
    image: litestream/litestream:0.3.14
    # Disabled by default - this whole service only starts when the
    # "litestream" profile is enabled (see deploy/.env.example).
    profiles:
      - litestream
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - slimm_data:/data
    environment:
      # Litestream reads these two exact variable names natively.
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    # No config file: endpoint and region ride as query parameters on the replica
    # URL, and 0.3.x auto-enables force-path-style whenever `endpoint` is set.
    command: >
      replicate /data/slimm.db
      "s3://${LITESTREAM_S3_BUCKET}/${LITESTREAM_S3_PATH:-slimm}?endpoint=${LITESTREAM_S3_ENDPOINT}&region=${LITESTREAM_S3_REGION:-auto}"

volumes:
  slimm_data:   # the embedded SQLite database
  caddy_data:   # Caddy's ACME account and issued certificates
  caddy_config: # Caddy's runtime config cache
