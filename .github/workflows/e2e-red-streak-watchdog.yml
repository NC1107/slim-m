# SPDX-License-Identifier: Apache-2.0
name: e2e-red-streak-watchdog

# e2e.yml is deliberately advisory: it does not gate a PR or a release, so a
# red run there produces no failure anyone else would see. Twice now that
# silence let a genuine multi-day regression ship underneath two releases
# with nothing anywhere saying so (CLAUDE.md's two "e2e was red" entries).
# This does not promote e2e to required, and does not change what gates a
# release; it only makes a sustained red streak impossible to not notice,
# by opening a GitHub issue rather than by this workflow's own colour -
# see scripts/check-e2e-red-streak.sh's own header for why a second red
# workflow would not have fixed the actual problem.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# No concurrency group, on the same reasoning release-tag-watchdog.yml
# already gives for having none: this runs hourly against a workflow
# (e2e.yml) that itself runs far less often, so two overlapping checks are
# not a realistic case, and the job is read-mostly and idempotent (issue
# dedup is by label, not by "did I already run this hour") so two of it
# racing costs nothing worth guarding against.

jobs:
  check:
    name: e2e has not been red for several runs in a row
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check the streak and manage the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-e2e-red-streak.sh
