# SPDX-License-Identifier: Apache-2.0
name: tokens

# Path-gated: only design-token source and this workflow's own script trigger
# this check. A server-only, schema-only, or unrelated client change never
# runs it.
#
# check-contrast.mjs runs with continue-on-error: true. The design tokens are
# still provisional (see docs/ROADMAP.md): the WCAG contrast gate is expected
# to flag the border color and the light-theme accent as needing design
# sign-off. The gate still runs on every relevant change and reports its
# findings in the job summary, so those failures are triaged into the design
# track instead of blocking this skeleton phase or being silently skipped.
on:
  push:
    branches: [main]
    paths:
      - "client/packages/design_system/**"
      - "scripts/check-contrast.mjs"
      - ".github/workflows/tokens.yml"
  pull_request:
    paths:
      - "client/packages/design_system/**"
      - "scripts/check-contrast.mjs"
      - ".github/workflows/tokens.yml"

permissions:
  contents: read

concurrency:
  group: tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast:
    name: design token contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # pin to commit SHA before public

      - uses: actions/setup-node@v6 # pin to commit SHA before public
        with:
          node-version: lts/*

      # continue-on-error: true so a known-provisional failure (border
      # contrast, light accent) annotates this run without blocking it.
      # steps.contrast.outcome still reflects the real pass/fail result,
      # independent of continue-on-error.
      - name: run WCAG contrast gate
        id: contrast
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-contrast.mjs | tee contrast-report.txt

      - name: write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Design token contrast gate"
            echo ""
            echo "Result: **${{ steps.contrast.outcome }}** (continue-on-error: true; does not block this workflow)"
            echo ""
            echo "The border-subtle contrast and the light-theme accent are known-provisional"
            echo "values pending design sign-off; see docs/ROADMAP.md."
            echo ""
            echo '```text'
            cat contrast-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
