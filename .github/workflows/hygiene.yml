# SPDX-License-Identifier: AGPL-3.0-only
name: hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # App Store review rejects a missing purpose string asynchronously, by
      # email after CI is green. This makes it a red PR; see docs/ci.md.
      - name: ios purpose strings are present
        run: |
          plist=client/packages/app/ios/Runner/Info.plist
          missing=()
          # NSLocationWhenInUseUsageDescription is here for an API the app
          # never calls: ITMS-90683 rejected build 82 over a linked SDK's
          # Core Location reference, and dropping the key repeats that.
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription \
                     NSPhotoLibraryUsageDescription \
                     NSLocationWhenInUseUsageDescription; do
            grep -q "<key>$key</key>" "$plist" || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::$plist is missing purpose strings: ${missing[*]}."
            echo "App Store review will reject the upload after CI goes green."
            exit 1
          fi
          echo "ios purpose strings present"

      - name: no emoji in UI source
        run: |
          # Emoji are user content (reactions), never chrome; chrome is Lucide.
          # Text sources only, so a compiled artifact cannot trip it.
          if grep -rlP --binary-files=without-match \
               --include='*.dart' --include='*.yaml' --include='*.arb' \
               '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{FE0F}\x{200D}]' \
               client/ 2>/dev/null; then
            echo "::error::emoji found in UI source; use Lucide icons for chrome"
            exit 1
          fi
          echo "no emoji in UI source"

      - name: SPDX headers on Rust source
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -1 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find crates -name '*.rs')
          exit $missing
