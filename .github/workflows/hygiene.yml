# SPDX-License-Identifier: AGPL-3.0-only
name: hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: no emoji in UI source
        run: |
          # Emoji are user content (reactions), never interface chrome.
          # Chrome uses Lucide icons. This gate fails on any emoji codepoint in
          # client source.
          # Text sources only, and --binary-files=without-match, so a compiled
          # artifact that happens to contain those bytes cannot trip the gate.
          if grep -rlP --binary-files=without-match \
               --include='*.dart' --include='*.yaml' --include='*.arb' \
               '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{FE0F}\x{200D}]' \
               client/ 2>/dev/null; then
            echo "::error::emoji found in UI source; use Lucide icons for chrome"
            exit 1
          fi
          echo "no emoji in UI source"

      - name: SPDX headers on Rust source
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -1 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find crates -name '*.rs')
          exit $missing
