name: e2e
#
# scripts/e2e.sh stands up a real LiveKit SFU, the release server binary and a
# real web build, then drives two isolated headless browsers through
# onboarding, messaging, moderation, screen share and a two-party voice call,
# checking each scenario against the server or the SFU. See docs/e2e.md.
#
# Runs on every push to main, on a nightly schedule for slower drift (a renamed
# label, a restructured screen), on workflow_dispatch for an ad hoc run, and on
# a pull request only when it touches a path that can break what the harness
# drives: voice and calls, the rtc and api packages, the server's auth, ws, hub
# and voice code, the canvas, the image, or the harness itself.
#
# The pull_request trigger exists because #653 moved the canvas into voice
# channels, the harness kept driving a text channel, and fourteen scenarios went
# red on every commit for two days while every per-area workflow stayed green.
# It is narrowed to those paths because at ~20 minutes it saturated the
# account's runners on every PR push and starved the required checks; a change
# outside them is still covered by the push to main and the nightly run.
#
# Still advisory rather than required: browser automation can be flaky for
# reasons unrelated to the change under test, and a red check nobody trusts
# teaches people to ignore CI. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "client/packages/rtc/**"
      - "client/packages/api/**"
      - "client/packages/voice_canvas/**"
      - "client/packages/platform/**"
      - "client/packages/app/lib/src/**/*voice*"
      - "client/packages/app/lib/src/**/*call*"
      - "client/packages/app/lib/src/**/*canvas*"
      - "client/packages/app/lib/src/**/*screen_share*"
      - "client/packages/app/lib/src/**/*stream*"
      - "client/packages/app/lib/src/routing/**"
      - "client/packages/app/lib/main.dart"
      - "client/pubspec.lock"
      - "crates/slimm-server/src/voice/**"
      - "crates/slimm-server/src/hub/**"
      - "crates/slimm-server/src/hub.rs"
      - "crates/slimm-server/src/auth.rs"
      - "crates/slimm-server/src/http/auth.rs"
      - "crates/slimm-server/src/http/ws.rs"
      - "crates/slimm-server/src/http/ws/**"
      - "crates/slimm-server/src/http/voice*.rs"
      - "crates/slimm-server/src/http/canvas*.rs"
      - "crates/slimm-server/src/lib.rs"
      - "crates/slimm-server/migrations/**"
      - "Cargo.lock"
      - "docker/**"
      - "schema/openapi.yaml"
      - "scripts/e2e.sh"
      - "scripts/lib/e2e_*.py"
      - "scripts/lib/test_e2e_*.py"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run is cancelled; main, nightly and manual runs queue so a merge burst still leaves a verdict.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"
  E2E_WORK: /tmp/e2e

jobs:
  e2e:
    name: the full stack, driven end to end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The harness's only third-party import; the rest of scripts/lib is stdlib.
      # Pinned and wheel-only so no sdist setup script runs, same reason the
      # actions above are pinned to commit shas.
      - name: python dependencies
        run: "pip install --only-binary :all: websocket-client==1.9.0"

      # Fast, no server needed: catches a regression in scenario logic before the 60-minute stack below runs at all.
      - name: unit tests for the harness's own scenario logic
        working-directory: scripts/lib
        run: python3 -m unittest discover -p 'test_*.py' -v

      # Deterministic resolve, the same reason client-ci does this before building.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: chrome is present
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::error::no google-chrome-stable or google-chrome on this runner"
            exit 1
          fi

      # E2E_REBUILD=1: a cached web build silently screenshots stale code.
      - name: run the harness
        env:
          E2E_REBUILD: "1"
        run: bash scripts/e2e.sh

      # Screenshots alone did not explain the first red run; these two did.
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-evidence
          path: |
            ${{ env.E2E_WORK }}/shots
            ${{ env.E2E_WORK }}/server.log
          if-no-files-found: warn
          retention-days: 14
