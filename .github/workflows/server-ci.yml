# SPDX-License-Identifier: AGPL-3.0-only
name: server-ci

# Path-gated: a client-only change never triggers a server build.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # NOTE: pin all actions to a commit SHA before this repository is public.
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all
      - name: build (release)
        run: cargo build --release --bin slimm-server
