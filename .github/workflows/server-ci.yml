# SPDX-License-Identifier: AGPL-3.0-only
name: server-ci

# Path-gated: a client-only change never triggers a server build.
# schema/openapi.yaml is included even though it is not Rust: tests/openapi_contract.rs
# gates the schema against the router, and a schema-only edit (documenting a path
# nothing serves, without touching crates/) must still run that test.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "schema/openapi.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "schema/openapi.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

# Build against the committed .sqlx query cache; no database needed in CI.
env:
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all
      - name: build (release)
        run: cargo build --locked --release --bin slimm-server
      - name: binary size budget
        # The brief treats binary size as a first-class budget; gate it in CI.
        run: |
          max=20971520   # 20 MiB
          size=$(stat -c%s target/release/slimm-server)
          echo "slimm-server: ${size} bytes (budget ${max})"
          if [ "$size" -gt "$max" ]; then
            echo "::error::release binary exceeds the 20 MiB budget"
            exit 1
          fi
