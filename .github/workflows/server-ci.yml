# SPDX-License-Identifier: AGPL-3.0-only
name: server-ci

# Path-gated: a client-only change never triggers a server build.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # pin to commit SHA before public
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # pin to commit SHA before public
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all
      - name: build (release)
        run: cargo build --release --bin slimm-server
      - name: binary size budget
        # The brief treats binary size as a first-class budget; gate it in CI.
        run: |
          max=20971520   # 20 MiB
          size=$(stat -c%s target/release/slimm-server)
          echo "slimm-server: ${size} bytes (budget ${max})"
          if [ "$size" -gt "$max" ]; then
            echo "::error::release binary exceeds the 20 MiB budget"
            exit 1
          fi
