# SPDX-License-Identifier: AGPL-3.0-only
name: release

# Full release and publish pipeline. How a release is cut, why server and client
# version independently, and what each job needs: docs/ci.md.

on:
  push:
    branches: [main]
    tags:
      - "server-v*"
      - "client-v*"

# Minimal default. Individual jobs widen this to exactly what they require.
permissions:
  contents: read

# Never cancel an in-flight release run; a half-published release is worse than
# a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens and maintains release PRs, and cuts releases on merge. A no-op on a tag
  # push, so downstream jobs can still resolve it via `needs`. See docs/ci.md.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server_released: ${{ steps.rp.outputs['crates/slimm-server--release_created'] }}
      server_tag: ${{ steps.rp.outputs['crates/slimm-server--tag_name'] }}
      server_version: ${{ steps.rp.outputs['crates/slimm-server--version'] }}
      client_released: ${{ steps.rp.outputs['client--release_created'] }}
      client_tag: ${{ steps.rp.outputs['client--tag_name'] }}
      client_version: ${{ steps.rp.outputs['client--version'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # One single-arch image per architecture, built on a NATIVE runner and pushed
  # to GHCR by digest. No QEMU, and no stored key material. See docs/ci.md.
  server-image:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.server_released == 'true') ||
      startsWith(github.ref, 'refs/tags/server-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nc1107/slim-m-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/${{ matrix.arch }}
          # Push by digest; the tagged manifest is assembled in the merge job.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error

  # Assembles the per-arch digests into one multi-arch manifest tag and
  # cosign-signs it keylessly over OIDC. Reviewer-gated.
  server-image-merge:
    needs: [release-please, server-image]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.server_released == 'true') ||
      startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/nc1107/slim-m-server
    steps:
      - name: resolve version
        id: ver
        run: |
          if [ -n "${{ needs.release-please.outputs.server_version }}" ]; then
            version="${{ needs.release-please.outputs.server_version }}"
          else
            version="${GITHUB_REF_NAME#server-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and inspect manifest
        id: manifest
        run: |
          version="${{ steps.ver.outputs.version }}"
          refs=""
          for f in /tmp/digests/*; do
            refs="${refs} ${IMAGE}@$(cat "$f")"
          done
          # `latest` is the rolling tag deployments track for auto-updates; the
          # version and sha tags stay for pinning and for tracing to a commit.
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            ${refs}
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the manifest-list digest, which covers both arch images and every
      # tag that resolves to it.
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"

  # Static musl binaries for direct download, built per arch into artifacts and
  # aggregated by server-release-assets.
  server-binaries:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.server_released == 'true') ||
      startsWith(github.ref, 'refs/tags/server-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: resolve version
        id: ver
        run: |
          if [ -n "${{ needs.release-please.outputs.server_version }}" ]; then
            version="${{ needs.release-please.outputs.server_version }}"
          else
            version="${GITHUB_REF_NAME#server-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Each arch builds its own musl target natively (no cross, no QEMU), the
      # same approach the container image uses.
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: build static binary
        run: cargo build --release --target ${{ matrix.target }} --bin slimm-server

      - name: stage binary
        id: stage
        run: |
          name="slimm-server-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}"
          install -Dm755 "target/${{ matrix.target }}/release/slimm-server" "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-binary-${{ matrix.arch }}
          path: dist/${{ steps.stage.outputs.name }}
          if-no-files-found: error

  # GPG-signable SHA256SUMS plus the raw binaries on the server GitHub Release.
  # The GPG secrets are optional; only the .asc is skipped. See docs/ci.md.
  server-release-assets:
    needs: [release-please, server-binaries]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.server_released == 'true') ||
      startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: resolve tag
        id: ver
        run: |
          if [ -n "${{ needs.release-please.outputs.server_tag }}" ]; then
            echo "tag=${{ needs.release-please.outputs.server_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-binary-*
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: sign checksums (optional)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/slimm-server-*
            dist/SHA256SUMS
            dist/SHA256SUMS.asc

  # Flatpak and rpm for the Linux client. A skeleton: packaging is inert until
  # packaging/flatpak/*.yaml and packaging/rpm/*.spec exist. See docs/ci.md.
  linux-client:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.client_released == 'true') ||
      startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: resolve version
        id: ver
        run: |
          if [ -n "${{ needs.release-please.outputs.client_version }}" ]; then
            echo "version=${{ needs.release-please.outputs.client_version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.release-please.outputs.client_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # libsecret-1-dev is here because flutter_secure_storage's Linux plugin
      # will not even configure without it. Why that is unavoidable: docs/ci.md.
      - name: linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: build linux release
        run: |
          flutter config --enable-linux-desktop
          dart pub get
          flutter build linux --release
        working-directory: client/packages/app

      # Gate packaging on the manifest and spec. Honest skeleton: no inputs, no
      # artifact, and a clearly visible warning rather than a green lie.
      - name: check packaging inputs
        id: pkg
        run: |
          if [ -f packaging/flatpak/org.slimm.Client.yaml ] && [ -f packaging/rpm/slim-m-client.spec ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Linux client packaging not wired yet. Add packaging/flatpak/org.slimm.Client.yaml and packaging/rpm/slim-m-client.spec to enable Flatpak and rpm builds. Skipping."
          fi

      - name: build flatpak
        if: steps.pkg.outputs.ready == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # TODO: the manifest must reference the flutter build output in
          # client/packages/app/build/linux/*/release/bundle as the app source.
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=dist/flatpak-repo build-dir \
            packaging/flatpak/org.slimm.Client.yaml
          flatpak build-bundle dist/flatpak-repo \
            "dist/slim-m-client-${{ steps.ver.outputs.version }}.flatpak" \
            org.slimm.Client

      - name: build rpm
        if: steps.pkg.outputs.ready == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          # TODO: the spec %install stage must stage the flutter bundle from
          # client/packages/app/build/linux/*/release/bundle into the buildroot.
          rpmbuild -bb \
            --define "_topdir ${PWD}/rpmbuild" \
            --define "_rpmdir ${PWD}/dist" \
            --define "app_version ${{ steps.ver.outputs.version }}" \
            packaging/rpm/slim-m-client.spec

      - name: checksums
        if: steps.pkg.outputs.ready == 'true'
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum *.flatpak **/*.rpm > SHA256SUMS

      - name: sign checksums (optional)
        if: steps.pkg.outputs.ready == 'true' && env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: steps.pkg.outputs.ready == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.flatpak
            dist/**/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.asc

  # Upload-signed apk and appbundle. Inert without its three secrets, and it
  # verifies the signer is the upload key, never debug. See docs/ci.md.
  android-client:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.client_released == 'true') ||
      startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - name: check secrets
        id: gate
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_B64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ] \
             && [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not configured. Add ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_KEY_PROPERTIES, and ANDROID_GOOGLE_SERVICES_JSON to enable the signed build. Skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'

      - name: resolve version
        if: steps.gate.outputs.ready == 'true'
        id: ver
        run: |
          # Both are needed: tag names the release, version feeds --build-name.
          # Emitting only tag left --build-name= empty on every run so far.
          if [ -n "${{ needs.release-please.outputs.client_version }}" ]; then
            echo "tag=${{ needs.release-please.outputs.client_tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.release-please.outputs.client_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: write signing assets
        if: steps.gate.outputs.ready == 'true'
        run: |
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" \
            > client/packages/app/android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d \
            > client/packages/app/android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" \
            > client/packages/app/android/key.properties

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          # The LTS the Android Gradle Plugin supports; local builds match.
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable

      - name: build android release
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          # --enforce-lockfile: resolve exactly what pubspec.lock pins.
          flutter pub get --enforce-lockfile
          # Build number from the run number and build name from the tag, never
          # from pubspec. Both stores reject a reuse; see docs/ci.md.
          flutter build appbundle --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: verify the signer is the upload key, not debug
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        env:
          # Play's registered upload certificate. A public fingerprint, not a
          # secret, and the only check that proves Play will accept the upload.
          EXPECTED_SHA256: 9dc12a6a03bd6125065fb5f6eca2d8d8477f74009e0f6624efee2d2b98ec033b
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk/build-tools" ]; then
            echo "::error::no Android build-tools; ANDROID_HOME='${sdk}'"
            exit 1
          fi
          tool="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$tool" ]; then
            echo "::error::no apksigner under $sdk/build-tools"
            ls -1 "$sdk/build-tools" || true
            exit 1
          fi
          # Captured to a file and echoed before matching. The previous form
          # assigned a grep pipeline, so a miss aborted with no output at all.
          "$tool" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk > certs.txt 2>&1 || {
              echo "::error::apksigner could not verify the release apk"
              cat certs.txt
              exit 1
            }
          cat certs.txt
          if grep -q 'Android Debug' certs.txt; then
            echo "::error::release apk is signed with the debug keystore; key.properties did not take effect"
            exit 1
          fi
          if ! grep -qi "$EXPECTED_SHA256" certs.txt; then
            echo "::error::signer is not Play's registered upload key (want $EXPECTED_SHA256)"
            exit 1
          fi
          echo "signed by the expected upload key"

      - name: checksums
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/slim-m-client-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/slim-m-client-android.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.android)

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: steps.gate.outputs.ready == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            client/packages/app/dist/slim-m-client-android.apk
            client/packages/app/dist/slim-m-client-android.aab
            client/packages/app/dist/SHA256SUMS.android

  # Signed ipa to TestFlight, reviewer-gated. Inert without its six secrets: it
  # warns and stops rather than faking an upload. See docs/ci.md.
  ios-testflight:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.client_released == 'true') ||
      startsWith(github.ref, 'refs/tags/client-v')
    runs-on: macos-latest
    environment: testflight
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
    steps:
      - name: resolve version
        id: ver
        run: |
          if [ -n "${{ needs.release-please.outputs.client_version }}" ]; then
            echo "version=${{ needs.release-please.outputs.client_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: check secrets
        id: gate
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] \
             && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$IOS_SIGNING_CERTIFICATE_P12" ] \
             && [ -n "$IOS_SIGNING_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS TestFlight secrets are not configured. Add the App Store Connect API key, signing certificate, and provisioning profile secrets to enable the build and upload. Skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'

      - name: import signing assets
        if: steps.gate.outputs.ready == 'true'
        run: |
          KEYDIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "${KEYDIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          # A throwaway keychain, not the login one: it keeps the private key
          # out of any shared default that later steps touch.
          CERT_PATH="${RUNNER_TEMP}/build_certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$IOS_SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Without this, codesign prompts for permission and hangs a headless run.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # xcodebuild finds a profile by its UUID under this directory, so the
          # file has to be named for the UUID embedded in its own signed plist.
          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID="$(security cms -D -i "$PROFILE_PATH" \
            | plutil -extract UUID raw -o - -)"
          cp "$PROFILE_PATH" "${PROFILE_DIR}/${UUID}.mobileprovision"

          # Name the identity codesign can actually see: a downstream failure
          # otherwise says only "no valid code signing certificates were found".
          echo "signing identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable

      - name: build ipa
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          # --enforce-lockfile: resolve exactly what pubspec.lock pins.
          flutter pub get --enforce-lockfile
          # Build number from the run number and build name from the tag, never
          # from pubspec. Both stores reject a reuse; see docs/ci.md.
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls build/ios/ipa/*.ipa | head -n1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
