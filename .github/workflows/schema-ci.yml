# SPDX-License-Identifier: Apache-2.0
name: schema-ci

# Path-gated: a server-only or client-only change never triggers the schema checks.
on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "redocly.yaml"
      - ".github/workflows/schema-ci.yml"
  pull_request:
    paths:
      - "schema/**"
      - "redocly.yaml"
      - ".github/workflows/schema-ci.yml"

permissions:
  contents: read

concurrency:
  group: schema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint openapi schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: redocly lint
        run: |
          npm install --no-save --ignore-scripts @redocly/cli@2.40.0
          ./node_modules/.bin/redocly lint schema/openapi.yaml

  breaking-change-gate:
    name: breaking-change gate (additive-only)
    # Diffing only makes sense against a PR's base branch. A push to main has no "other
    # side" to diff against here, so this job runs only for pull_request events; a push
    # to main is covered by the lint job above and skips the diff entirely.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's head commit explicitly (rather than the default merge-ref
      # checkout) so `HEAD:schema/openapi.yaml` below is exactly the schema the PR
      # proposes, with no synthetic merge commit in between.
      - name: checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # oasdiff also needs the base branch's schema content, but the checkout above only
      # fetched the PR head commit. Fetch just that one base commit, shallowly, by its
      # exact SHA (from the pull_request event payload) so it lands in the local object
      # database without cloning the base branch's history; oasdiff then reads it
      # straight out of git as `<base-sha>:schema/openapi.yaml` below.
      - name: fetch base commit for diff
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      # `oasdiff breaking` reports only changes that break existing clients (removed
      # paths/fields, narrowed types, newly required properties, and similar). Purely
      # additive changes, such as a new optional field or a new endpoint, are not
      # breaking and pass, which is what makes this gate "additive-only" by construction.
      - name: oasdiff breaking-change check
        uses: oasdiff/oasdiff-action/breaking@45c956ed8138f7f18f0425d34e3d66730b805cb2 # v0
        with:
          base: "${{ github.event.pull_request.base.sha }}:schema/openapi.yaml"
          revision: "HEAD:schema/openapi.yaml"
          fail-on: ERR

  # GitHub's file view shows OpenAPI as plain YAML, so a browsable rendering
  # is built on every schema change to main and attached as a run artifact.
  # It is NOT deployed anywhere: the owner already uses nc1107.github.io for
  # something else and asked that nothing be published there. To read it,
  # download the artifact, or run locally:
  #   npx @redocly/cli build-docs schema/openapi.yaml -o /tmp/api.html
  render-docs:
    name: render api docs artifact
    if: github.event_name == 'push'
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: build redoc html
        run: |
          mkdir -p dist
          npm install --no-save --ignore-scripts @redocly/cli@2.40.0
          ./node_modules/.bin/redocly build-docs schema/openapi.yaml -o dist/index.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-docs
          path: dist/index.html
          retention-days: 90
