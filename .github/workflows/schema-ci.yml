# SPDX-License-Identifier: Apache-2.0
name: schema-ci

# Path-gated: a server-only or client-only change never triggers the schema checks.
on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "redocly.yaml"
      - ".github/workflows/schema-ci.yml"
  pull_request:
    paths:
      - "schema/**"
      - "redocly.yaml"
      - ".github/workflows/schema-ci.yml"

permissions:
  contents: read

concurrency:
  group: schema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint openapi schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: redocly lint
        run: |
          npm install --no-save --ignore-scripts @redocly/cli@2.40.0
          ./node_modules/.bin/redocly lint schema/openapi.yaml

  breaking-change-gate:
    name: breaking-change gate (additive-only)
    # A push to main has no other side to diff against, so this is pull_request
    # only and main is covered by the lint job above; see docs/ci.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The head commit explicitly, not the default merge-ref, so HEAD below is
      # exactly the schema the PR proposes with no merge commit in between.
      - name: checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # oasdiff reads the base schema straight out of git, so that one commit is
      # fetched shallowly by SHA rather than cloning history; see docs/ci.md.
      - name: fetch base commit for diff
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      # `oasdiff breaking` flags only what breaks existing clients, which is what
      # makes this gate additive-only by construction; see docs/ci.md.
      - name: oasdiff breaking-change check
        uses: oasdiff/oasdiff-action/breaking@45c956ed8138f7f18f0425d34e3d66730b805cb2 # v0
        with:
          base: "${{ github.event.pull_request.base.sha }}:schema/openapi.yaml"
          revision: "HEAD:schema/openapi.yaml"
          fail-on: ERR
