# SPDX-License-Identifier: Apache-2.0
name: client-ci

# Path-gated: a server-only or schema-only change never triggers the Flutter client build.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-format-test:
    name: analyze, format check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get

      - name: analyze (workspace-wide)
        working-directory: client
        run: dart analyze

      - name: format check (workspace-wide)
        working-directory: client
        run: dart format --output=none --set-exit-if-changed .

      # Goldens run inside these suites, not a job of their own, and only ever on
      # this channel and runner. If they start flaking, see docs/ci.md.
      - name: test (every workspace package)
        working-directory: client
        run: |
          set -euo pipefail
          status=0
          for pkg in . packages/*/; do
            dir="${pkg%/}"
            if [ -d "$dir/test" ]; then
              echo "::group::flutter test - $dir"
              (cd "$dir" && flutter test) || status=$?
              echo "::endgroup::"
            fi
          done
          exit "$status"

  # The CallKit synchronous-report invariant is a termination risk, not a style
  # rule, so it gets a macOS runner. Simulator only; see docs/ci.md.
  ios-unit-tests:
    name: ios unit tests (callkit invariant)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get

      # xcodebuild will not open the project until a Flutter build has generated
      # its config and plugin registrant. --no-codesign keeps it to compiling.
      - name: generate the ios project
        working-directory: client/packages/app
        run: flutter build ios --simulator --no-codesign

      # Chosen from what the runner actually has, not by name: a hardcoded
      # 'iPhone 16' broke on day one and would break on every image roll.
      - name: pick an available simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items()):
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid'])
                      raise SystemExit
          ")
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid" || true

      - name: run xctest
        working-directory: client/packages/app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

