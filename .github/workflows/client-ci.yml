# SPDX-License-Identifier: Apache-2.0
name: client-ci

# Path-gated: a server-only or schema-only change never triggers the Flutter client build.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-format-test:
    name: analyze, format check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get

      - name: analyze (workspace-wide)
        working-directory: client
        run: dart analyze

      - name: format check (workspace-wide)
        working-directory: client
        run: dart format --output=none --set-exit-if-changed .

      # Golden-test note: golden-file assertions (matchesGoldenFile) live inside each
      # package's ordinary `flutter test` suite below; they are not a separate job here.
      # Golden PNGs are sensitive to the exact Flutter engine/Skia build and to font
      # rendering, so keep goldens generated and verified on this same `stable` channel
      # on ubuntu-latest. If goldens start flaking across runs, pin an exact Flutter
      # version here (instead of floating on `stable`) and regenerate goldens with
      # `flutter test --update-goldens` on that same pinned version, so both sides
      # render identically.
      - name: test (every workspace package)
        working-directory: client
        run: |
          set -euo pipefail
          status=0
          for pkg in . packages/*/; do
            dir="${pkg%/}"
            if [ -d "$dir/test" ]; then
              echo "::group::flutter test - $dir"
              (cd "$dir" && flutter test) || status=$?
              echo "::endgroup::"
            fi
          done
          exit "$status"

  # The CallKit synchronous-report invariant is a real termination risk, not a
  # style rule: iOS kills an app that takes a VoIP push without reporting a
  # call before the handler returns, and repeat offences cost it VoIP push
  # entirely. That makes it worth a macOS runner of its own, because the
  # ubuntu job above runs Dart tests and cannot compile a line of Swift.
  #
  # Simulator only, so it needs no signing identity and no secrets: this
  # compiles the Swift and runs XCTest, it does not produce a shippable build.
  # The signed device build stays in the release workflow.
  ios-unit-tests:
    name: ios unit tests (callkit invariant)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get

      # xcodebuild needs the generated Flutter config and the plugin registrant
      # to exist before the project will open, and only a Flutter build makes
      # them. --no-codesign keeps it to compiling, with no identity involved.
      - name: generate the ios project
        working-directory: client/packages/app
        run: flutter build ios --simulator --no-codesign

      - name: run xctest
        working-directory: client/packages/app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

