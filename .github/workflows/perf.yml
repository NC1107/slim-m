# SPDX-License-Identifier: AGPL-3.0-only
name: perf

# Path-gated: only server and perf-scaffolding changes touch this workflow.
# GitHub Actions does not support path filters on the `release` event, so the
# release-triggered job below is not path-gated; it only ever runs once per
# published release regardless.
on:
  pull_request:
    paths:
      - "crates/**"
      - "perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/perf.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

# Compiling the crate needs the committed .sqlx query cache, no database.
env:
  SQLX_OFFLINE: "true"

jobs:
  # Fast compile-only gate on every pull request: proves the benchmarks still
  # build without paying for a full measurement run on each push.
  compile-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # pin to commit SHA before public
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # pin to commit SHA before public
      - name: compile benches (no run)
        run: cargo bench -p slimm-server --no-run

  # Runs the real benchmarks once a release is published and uploads the
  # criterion report as a workflow artifact for hand-curation into a new
  # perf/baselines/<version>.json (see perf/README.md).
  #
  # No environment gate: this uploads only an intra-run workflow artifact, not a
  # published release asset, so it is treated as exempt for the same reason the
  # release workflow's server-binaries build stage is. Reviewer-gated
  # Environments are applied at the true publish boundary (GHCR push, release
  # assets, TestFlight), not to build-time artifacts. No secrets are used.
  benchmark:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # pin to commit SHA before public
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # pin to commit SHA before public
      - name: run benchmarks
        run: cargo bench -p slimm-server
      - uses: actions/upload-artifact@v7 # pin to commit SHA before public
        with:
          name: criterion-report-${{ github.event.release.tag_name }}
          path: target/criterion
          retention-days: 90
