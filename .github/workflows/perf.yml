# SPDX-License-Identifier: AGPL-3.0-only
name: perf

# Path-gated to server and perf-scaffolding changes. Actions cannot path-filter
# the `release` event, so the release job below is not; see docs/ci.md.
on:
  pull_request:
    paths:
      - "crates/**"
      - "perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/perf.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

# Compiling the crate needs the committed .sqlx query cache, no database.
env:
  SQLX_OFFLINE: "true"

jobs:
  # Fast compile-only gate on every pull request: proves the benchmarks still
  # build without paying for a full measurement run on each push.
  compile-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: compile benches (no run)
        run: cargo bench --locked -p slimm-server --no-run

  # Real benchmarks on a published release, uploaded for hand-curation into
  # perf/baselines/. Deliberately not environment-gated; see docs/ci.md.
  benchmark:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: run benchmarks
        run: cargo bench --locked -p slimm-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-report-${{ github.event.release.tag_name }}
          path: target/criterion
          retention-days: 90
