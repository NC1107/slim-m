name: verify-release-checks

# Gates every publish job on this commit's own CI having succeeded, for both the release-please and the by-hand tag path; docs/ci.md.

on:
  workflow_call:
    inputs:
      required_checks:
        description: >-
          Pipe-separated, exact check-run names that must show conclusion
          "success" on the verified ref before this call returns success.
        required: true
        type: string
      ref:
        description: >-
          The commit to verify, as anything the commits API accepts (a SHA or
          a tag). Defaults to github.sha, which is right for the tag-push path
          because the tag is what triggered the run. On the release-please
          path the caller must pass the created tag instead: release-please
          acts on the repository's current state while github.sha is whatever
          commit started the run, and those diverge whenever a release merge
          lands while an earlier run is still going. Verifying github.sha then
          waits for a check that a path filter correctly skipped, times out,
          and skips every publish job behind it, which is what happened to
          server 0.23.0 on 2026-08-01.
        required: false
        default: ""
        type: string

permissions:
  checks: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Ceiling over the script's 180-minute deadline (10800s); see docs/ci.md.
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: wait for the required checks and require they all succeeded here
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
        run: bash scripts/verify-release-checks.sh
