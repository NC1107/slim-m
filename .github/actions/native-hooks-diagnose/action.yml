#
# Prints why a native build hook failed. Use it as an `if: failure()` step
# after a client build.
#
# Flutter reports a failed hook as only "Building assets for package:X failed".
# The cause (a failed download, a compiler error) goes to the hook's stderr,
# which Flutter does not keep: hooks_runner/<pkg>/<hash>/stderr.txt is empty.
# A hook that failed has an input.json and no output.json, and its stdout.txt
# records the exact command Flutter ran, so this runs that command again.

name: native hooks diagnose
description: Re-run every native build hook that left no output and print what it says.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: client
      run: |
        failed=0
        for input in .dart_tool/hooks_runner/*/*/input.json; do
          dir="$(dirname "$input")"
          [ -f "$dir/output.json" ] && continue
          failed=1
          echo "::group::hook without output: $dir"
          cmd="$(sed -n 's/^Running `\(.*\)`\.$/\1/p' "$dir/stdout.txt" | head -n 1)"
          if [ -n "$cmd" ]; then bash -c "$cmd" 2>&1 | tail -n 80; else echo "no command recorded in $dir/stdout.txt"; fi
          echo "::endgroup::"
        done
        [ "$failed" = 1 ] || echo "every hook that started produced output; the failure was not in a native build hook"
