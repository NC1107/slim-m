# Analyzer options for every package in this workspace.
#
# Options resolve by nearest enclosing directory, and until this file existed
# the only one was packages/app/analysis_options.yaml - so `dart analyze`
# applied zero lints to api, data, design_system, platform, rtc and
# voice_canvas, all six of which already carry flutter_lints as a dev
# dependency. The app keeps its own file, which wins for that package by
# being nearer.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
