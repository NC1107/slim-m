# SPDX-License-Identifier: Apache-2.0
name: slimm_app
description: slim-m client application shell.
publish_to: none
# Feeds CFBundleShortVersionString and CFBundleVersion. Without it an archive
# builds but cannot be submitted, and every TestFlight upload would collide on
# the same missing build number.
version: 0.1.0+2
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  slimm_api:
  slimm_data:
  slimm_design_system:
  slimm_platform:
  drift: ^2.20.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
flutter:
  uses-material-design: true
