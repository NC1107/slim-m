# SPDX-License-Identifier: Apache-2.0
name: slimm_app
description: slim-m client application shell.
publish_to: none
# Feeds CFBundleShortVersionString/CFBundleVersion; kept in lockstep by an extra-files marker, not a component - see CLAUDE.md.
version: 0.41.1 # x-release-please-version
resolution: workspace
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"
dependencies:
  # Cross-platform including Linux (its own GStreamer plugin, not a bundled
  # native compile) and lets a caller set iOS's .ambient session category -
  # see notification_sound.dart and docs/dependencies.md.
  audioplayers: ^6.8.1
  # Ambient, so a hard-reset floor measures against a test's fake clock rather than real wall time.
  clock: ^1.1.0
  emojis: ^3.2.0
  # Pinned exactly, not a caret. `^12.0.0` matches no version at all (a caret
  # without a prerelease excludes every prerelease), and `^12.0.0-beta.7` would
  # float onto later betas, which have broken each other three times already.
  file_picker: 12.0.0-beta.7
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  slimm_api:
  slimm_data:
  slimm_design_system:
  slimm_platform:
  slimm_rtc:
  slimm_voice_canvas:
  drift: ^2.20.0
  # 10.x, not 9.x: file_picker 12 requires win32 6, so the whole tree moves
  # off win32 5 and the old hold on 9.x no longer resolves.
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  # Frameless/drag/resize/minimize-hide and off-screen-geometry validation;
  # see docs/decisions/0012-desktop-window-shell.md and docs/dependencies.md.
  screen_retriever: ^0.2.2
  # The tray icon and its context menu; same publisher family as window_manager.
  tray_manager: ^0.5.3
  # Already resolved transitively; direct so composer_clipboard_image_web.dart can import it.
  web: ^1.1.0
  window_manager: ^0.5.2
dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
flutter:
  uses-material-design: true
  # A symlink to the repo-root `assets/audio/notifications/` (see its own
  # generate.py): Flutter drops an asset path outside the package silently,
  # confirmed by a build that produced no error and no bundled file.
  assets:
    - assets/audio/notifications/call_ring.wav
    - assets/audio/notifications/direct_message.wav
    - assets/audio/notifications/error.wav
    - assets/audio/notifications/group_message.wav
    - assets/audio/notifications/member_join.wav
    - assets/audio/notifications/member_leave.wav
    - assets/audio/notifications/mention.wav
    # A symlink to packaging/linux/icons/, same reason and same shape as the
    # audio symlink above: a `../../../` pubspec path bundles nothing.
    - assets/icons/tray_icon.png
