# SPDX-License-Identifier: Apache-2.0
name: slimm_app
description: slim-m client application shell.
publish_to: none
# Feeds CFBundleShortVersionString and CFBundleVersion. Without it an archive
# builds but cannot be submitted, and every TestFlight upload would collide on
# the same missing build number.
version: 0.1.0+4
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  file_picker: ^11.0.0
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  slimm_api:
  slimm_data:
  slimm_design_system:
  slimm_platform:
  slimm_rtc:
  drift: ^2.20.0
  # Held on 9.x deliberately. 10.x moved to win32 6, and every other
  # Windows-only package in the tree (device_info_plus, which
  # livekit_client pulls, plus flutter_secure_storage_windows and
  # win32_registry) is still on win32 5. Those libraries type-check on a
  # Linux build even though they never run there, so the mismatch is a
  # hard build failure rather than a Windows-only concern. Staying on 9.x
  # is what lets the client use current livekit_client and flutter_webrtc.
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
flutter:
  uses-material-design: true
