<!-- The app icon at 16, 22 and 24px: the same mark, drawn at 78% of the tile
     rather than 60%, so the dots survive the size instead of being dropped.
     512*0.78/20.2 = 19.770297 maps the mark's 20.2-unit bounding box there.
     An earlier revision used glyph.svg, the lone square, and a launcher entry
     with no lattice in it does not read as this app at all. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="slim-m">
  <rect width="512" height="512" rx="114" fill="#17191C"/>
  <g fill="#58B4D8" transform="translate(256,256) scale(19.770297) translate(-15.9,-15.9)">
    <circle cx="9" cy="9" r="3.2"/>
    <circle cx="21" cy="9" r="3.2"/>
    <circle cx="9" cy="21" r="3.2"/>
    <rect x="15" y="15" width="11" height="11" rx="3.5"/>
  </g>
</svg>
