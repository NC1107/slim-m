# SPDX-License-Identifier: Apache-2.0
name: slimm_design_system
description: slim-m design tokens, theme, and icon wrappers.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  # Lucide is the icon set of record; AppIcons is the only place widgets touch
  # it, so swapping sets later is one file.
  lucide_icons_flutter: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  # Bundled, not system-resolved: IBM Plex is not installed on a typical Linux or
  # Windows box, and the mono fallback is proportional, breaking code and numerals.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
