# Dart native pub workspace (no third-party monorepo manager).
# Each package resolves against this shared workspace.
name: slim_m_workspace
# release-please tracks the client version here; kept explicit so the first
# client release is 0.1.0 rather than defaulting to 1.0.0.
version: 0.88.0
publish_to: none
environment:
  sdk: ^3.10.0
# Only honoured at the workspace root, which is why it is not in packages/app.
# livekit_client 2.8.1 pins device_info_plus ^12.3.0, which caps win32 at 5.x;
# file_picker 12 needs win32 ^6.3.0. Drop when livekit ships a 13.x.
dependency_overrides:
  device_info_plus: ^13.2.0
  # Fork adds resetDesktopSources; see docs/dependencies.md. livekit_client needs it hosted, so it is an override.
  flutter_webrtc:
    git:
      url: https://github.com/Slim-m-org/flutter-webrtc.git
      ref: 52a0c681c9173b9dab6fda9f761d56d708cc58a5
workspace:
  - packages/api
  - packages/design_system
  - packages/data
  - packages/platform
  - packages/rtc
  - packages/voice_canvas
  - packages/app
# Encrypted local database engine; see docs/decisions/0042-encrypt-local-database.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
